# Alembic config for soft-floyd. sqlalchemy.url is set dynamically in
# env.py from soft_floyd_core.config.get_settings().db_path — never
# hardcoded here, so `data/soft-floyd.db` stays gitignored local state.

[alembic]
script_location = %(here)s/packages/core/src/soft_floyd_core/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
