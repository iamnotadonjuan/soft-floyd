[project]
name = "soft-floyd-server"
version = "0.1.0"
description = "Soft Floyd backend — FastMCP tools + FastAPI routes, one ASGI app"
requires-python = ">=3.12"
dependencies = [
    "soft-floyd-core",
    "fastmcp>=2.3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.13",
]

[tool.uv.sources]
soft-floyd-core = { workspace = true }

[project.scripts]
soft-floyd = "soft_floyd_server.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soft_floyd_server"]
