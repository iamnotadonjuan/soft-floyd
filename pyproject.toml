[project]
name = "soft-floyd-workspace"
version = "0.1.0"
description = "Soft Floyd — a sensor-aware AI cycling coach (uv workspace root)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/server"]

[dependency-groups]
dev = [
    "soft-floyd-core",
    "soft-floyd-server",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv.sources]
soft-floyd-core = { workspace = true }
soft-floyd-server = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages", "apps"]
