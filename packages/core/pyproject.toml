[project]
name = "soft-floyd-core"
version = "0.1.0"
description = "Soft Floyd domain logic — config, models, rider profile, sensor capability model, LLM client"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "openai>=1.54",
    "alembic>=1.13",
    "garminconnect>=0.3.15",
    "fitdecode>=0.10",
    "anyio>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soft_floyd_core"]
